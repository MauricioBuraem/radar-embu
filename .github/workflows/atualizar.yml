name: Publicar site

# A coleta roda no computador do projeto (robo/atualizar.ps1, agendado no Windows):
# o NoPaper da Câmara não aceita conexões dos servidores do GitHub.
# Cada envio de dados novos para a branch main publica o site no GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/atualizar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
