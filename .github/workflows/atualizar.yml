name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 7 * * *"    # 04:17 em Brasília, todo dia
    - cron: "17 17 * * *"   # 14:17 em Brasília (pega as sessões de quarta de manhã no mesmo dia)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PDFs e texto extraído das sessões já lidas: evita baixar e processar tudo de novo
      - uses: actions/cache@v4
        with:
          path: dados/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - run: pip install -r requirements.txt

      - name: Coletar
        run: python -m coletor

      - name: Gerar dados do site
        run: python -m coletor.site

      - name: Guardar dados no repositório
        run: |
          git config user.name "radar-embu-bot"
          git config user.email "radar-embu-bot@users.noreply.github.com"
          git add dados/embu.json site/dados.js site/fotos
          git diff --cached --quiet || git commit -m "dados: atualização automática $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
